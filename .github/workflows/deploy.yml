name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar bloques GLB
        run: |
          archivos="models/bloques/index.json models/bloques/bloque_sw.glb models/bloques/bloque_se.glb models/bloques/bloque_nw.glb models/bloques/bloque_ne.glb"
          for archivo in $archivos; do
            if [ ! -f "$archivo" ]; then
              echo "Falta el archivo obligatorio: $archivo"
              exit 1
            fi
          done

      - name: Preparar el sitio
        run: |
          rm -rf _site
          mkdir -p _site/models/bloques
          cp index.html main.js style.css _site/
          cp -R models/bloques/. _site/models/bloques/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
